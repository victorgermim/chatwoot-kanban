name: publish-ghcr
on:
  push:
    branches: [ feature/kanban-menu ] 
  workflow_dispatch: {}               
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile 
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/victorgermim/chatwoot-kanban:latest
            ghcr.io/victorgermim/chatwoot-kanban:sha-${{ github.sha }}
